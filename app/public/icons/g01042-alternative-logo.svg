<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">G01042 alternative logo</title>
  <desc id="desc">Two-line G01 042 text over a blue paramedic star on a black rounded square with a white border.</desc>
  <defs>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.145 0 0 0 0 0.388 0 0 0 0 0.922 0 0 0 .45 0"
      />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#000000" />
  <rect x="13" y="13" width="486" height="486" rx="84" fill="none" stroke="#f8fafc" stroke-width="5" />
  <g filter="url(#softGlow)" transform="translate(256 256)">
    <g fill="none" stroke="#f8fafc" stroke-width="66" stroke-linecap="square" stroke-linejoin="miter" opacity=".95">
      <path d="M0 -156V156" />
      <path d="M-156 0H156" />
      <path d="M-110 -110L110 110" />
      <path d="M110 -110L-110 110" />
    </g>
    <g fill="none" stroke="#2563eb" stroke-width="52" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M0 -156V156" />
      <path d="M-156 0H156" />
      <path d="M-110 -110L110 110" />
      <path d="M110 -110L-110 110" />
    </g>
  </g>
  <g
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="92"
    font-weight="900"
    letter-spacing="0"
    stroke="#dc2626"
    stroke-width="8"
    paint-order="stroke fill"
    fill="#f8fafc"
  >
    <text x="256" y="251">G01</text>
    <text x="256" y="327">042</text>
  </g>
</svg>
